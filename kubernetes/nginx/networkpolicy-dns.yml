# Restores cluster DNS for every Pod in the namespace, which the default deny removed.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: demo
  labels:
    app.kubernetes.io/part-of: k8-lab
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    # One list item with two selectors means AND: kube-dns Pods, in kube-system.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53