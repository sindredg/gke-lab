# Restores cluster DNS for every Pod in the namespace, which the default deny removed.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: demo
  labels:
    app.kubernetes.io/part-of: k8-lab
spec:
  podSelector: {}

  policyTypes:
    - Egress

  egress:
    # NodeLocal DNSCache answers first, kube-dns when it is bypassed.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchExpressions:
              - key: k8s-app
                operator: In
                values:
                  - kube-dns
                  - node-local-dns

      # Answers too large for UDP are retried over TCP.
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
