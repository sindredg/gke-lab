# Caps the total resources every Pod in the namespace can reserve and consume.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: demo-budget
  namespace: demo
  labels:
    app.kubernetes.io/part-of: k8-lab
spec:
  hard:
    # Total reserved capacity, which the scheduler counts against nodes.
    requests.cpu: "1"
    requests.memory: 1Gi

    # Total ceiling the namespace can burst to. Steady state is 1500m across
    # both workloads. A Pod in its preStop sleep still counts, so a rollout can
    # end with two new Pods and both old ones: sky peaks at 2000m, nginx at
    # 1000m. Rolled together they reach 3000m and the deploy smoke test's 250m
    # is refused, which is why both deploy workflows share one concurrency
    # group. One at a time, the peak with the smoke Pod is 2750m. A surge Pod
    # that does not fit stalls a rollout rather than failing it, because of
    # maxUnavailable 0, which is the hardest shape of problem to recognise.
    # Only requests are scheduled, so a burst ceiling above one node's
    # capacity still bounds the namespace.
    limits.cpu: "3"
    limits.memory: 2Gi

    # Object count, independent of resource size.
    pods: "10"