# Caps the total resources every Pod in the namespace can reserve and consume.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: demo-budget
  namespace: demo
  labels:
    app.kubernetes.io/part-of: k8-lab
spec:
  hard:
    # Total reserved capacity, which the scheduler counts against nodes.
    requests.cpu: "1"
    requests.memory: 1Gi

    # Total ceiling the namespace can burst to. Steady state is 1500m across
    # both workloads, and each rollout adds one surge Pod. Two rollouts at once
    # reach 2250m, which a ceiling of 2 rejects: with maxUnavailable 0 the
    # second rollout then stalls rather than failing, which is the hardest
    # shape of problem to recognise. Only requests are scheduled, so a burst
    # ceiling above one node's capacity still bounds the namespace.
    limits.cpu: "3"
    limits.memory: 2Gi

    # Object count, independent of resource size.
    pods: "10"