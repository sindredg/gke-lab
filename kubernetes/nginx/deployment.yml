# Runs and maintains two healthy NGINX replicas.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: demo
  labels:
    app.kubernetes.io/name: nginx
    app.kubernetes.io/part-of: k8-lab
spec:
  replicas: 2
  revisionHistoryLimit: 3

  selector:
    matchLabels:
      app.kubernetes.io/name: nginx

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  template:
    metadata:
      labels:
        app.kubernetes.io/name: nginx
        app.kubernetes.io/part-of: k8-lab
    spec:
      serviceAccountName: nginx
      automountServiceAccountToken: false

      # Spreads the replicas across nodes when the pool has more than one, and schedules anyway when it does not. A required anti-affinity rule would instead leave the second replica Pending whenever the pool sits at its single-node floor. The value is in node upgrades, which replace nodes underneath a running workload.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: nginx

      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: nginx
          # Deployed by digest, so this manifest names one fixed set of bytes. The tag is the commit that built it, kept for readers only.
          image: europe-north1-docker.pkg.dev/example-security-lab/k8-lab/frontend:2bb5f3a-multiarch@sha256:9f95c44c693fe186af2785917a8476fe5cfed5baad6a7b03a39e7312f65d0195
          imagePullPolicy: IfNotPresent

          # The page reports the Pod answering the request, so these are read from the running Pod instead of being written into the image.
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName

            # The downward API cannot read the image, so the pipeline sets this in the same patch that sets the image.
            # The value here matches the digest above, for an apply that doesnt go through the pipeline.
            - name: IMAGE_DIGEST
              value: sha256:9f95c44c693fe186af2785917a8476fe5cfed5baad6a7b03a39e7312f65d0195

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

          # A non-root process cannot bind a port below 1024.
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 1
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 1
            failureThreshold: 3

          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
