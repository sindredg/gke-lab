apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: demo
  labels:
    app.kubernetes.io/name: nginx
    app.kubernetes.io/part-of: k8-lab
spec:
  replicas: 2
  revisionHistoryLimit: 3

  selector:
    matchLabels:
      app.kubernetes.io/name: nginx

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  template:
    metadata:
      labels:
        app.kubernetes.io/name: nginx
        app.kubernetes.io/part-of: k8-lab
    spec:
      serviceAccountName: nginx
      automountServiceAccountToken: false

      # 60 covers the 35s preStop sleep and the requests still in flight.
      terminationGracePeriodSeconds: 60

      # Prefers one replica per node. Required would leave one Pending.
      topologySpreadConstraints:
        # Counts only this ReplicaSet, so the spread survives a rollout.
        - matchLabelKeys: ["pod-template-hash"]
          maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: nginx

      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: nginx
          # Deployed by digest. The tag names the commit that built it.
          image: europe-north1-docker.pkg.dev/example-security-lab/k8-lab/frontend:2bb5f3a-multiarch@sha256:9f95c44c693fe186af2785917a8476fe5cfed5baad6a7b03a39e7312f65d0195
          imagePullPolicy: IfNotPresent

          # Read from the running Pod, so the page reports who answered.
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName

            # The downward API cannot read the image; the pipeline sets it.
            - name: IMAGE_DIGEST
              value: sha256:9f95c44c693fe186af2785917a8476fe5cfed5baad6a7b03a39e7312f65d0195

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          # A non-root process cannot bind a port below 1024.
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 1
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 1
            failureThreshold: 3

          # Keeps a stopping Pod serving until the load balancer lets go.
          lifecycle:
            preStop:
              sleep:
                seconds: 35

          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi

          # nginx writes its PID and temp files to /tmp and renders its config into conf.d.
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: conf-d
              mountPath: /etc/nginx/conf.d

      volumes:
        - name: tmp
          emptyDir: {}
        - name: conf-d
          emptyDir: {}
