# Names the Cloud Armor policy Terraform owns; each backend attaches its own.
apiVersion: networking.gke.io/v1
kind: GCPBackendPolicy
metadata:
  name: nginx
  namespace: demo
  labels:
    app.kubernetes.io/name: nginx
    app.kubernetes.io/part-of: k8-lab
spec:
  default:
    securityPolicy: k8-lab-gateway-rate-limit

  targetRef:
    group: ""
    kind: Service
    name: nginx
