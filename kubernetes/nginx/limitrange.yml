# Defaults for containers that declare none, so a quota cannot reject them.
apiVersion: v1
kind: LimitRange
metadata:
  name: demo-defaults
  namespace: demo
  labels:
    app.kubernetes.io/part-of: k8-lab
spec:
  limits:
    - type: Container

      default:
        cpu: 250m
        memory: 128Mi

      defaultRequest:
        cpu: 50m
        memory: 64Mi
