# Creates isolated namespace for the NGINX workload and applies Pod Security Standards to Pods admitted into it.
apiVersion: v1
kind: Namespace
metadata:
  name: demo
  labels:
    app.kubernetes.io/part-of: k8-lab

    # Reject Pods that violate the restricted standard.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.35

    # Keep reporting at the same level, so a violation also reaches the audit log.
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: v1.35
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: v1.35