apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: nginx
  namespace: demo
  labels:
    app.kubernetes.io/name: nginx
    app.kubernetes.io/part-of: k8-lab
spec:
  parentRefs:
    - name: external
      sectionName: https

  hostnames:
    - sindrg.com

  rules:
    # Filters attach to a rule, so every rule serving this host repeats the set.
    - filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              # One day, no includeSubDomains, no preload: both are one-way doors.
              - name: Strict-Transport-Security
                value: max-age=86400
              - name: X-Content-Type-Options
                value: nosniff
              - name: Referrer-Policy
                value: strict-origin-when-cross-origin
      backendRefs:
        - name: nginx
          port: 80
