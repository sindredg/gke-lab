# Sends everything arriving at the Gateway to the nginx Service.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: nginx
  namespace: demo
  labels:
    app.kubernetes.io/name: nginx
    app.kubernetes.io/part-of: k8-lab
spec:
  parentRefs:
    - name: external
      sectionName: https

  hostnames:
    - sindrg.com

  rules:
    - backendRefs:
        - name: nginx
          port: 80
