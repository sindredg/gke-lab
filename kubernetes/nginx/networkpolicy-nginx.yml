# Lets labelled clients in the namespace reach nginx on the HTTP port.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: nginx-allow-http
  namespace: demo
  labels:
    app.kubernetes.io/name: nginx
    app.kubernetes.io/part-of: k8-lab
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: nginx

  policyTypes:
    - Ingress

  ingress:
    - from:
        - podSelector:
            matchLabels:
              nginx-client: "true"
      ports:
        - protocol: TCP
          port: 8080
---
# Lets those clients open the connection, which their egress deny blocks.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: nginx-client-allow-egress
  namespace: demo
  labels:
    app.kubernetes.io/part-of: k8-lab
spec:
  podSelector:
    matchLabels:
      nginx-client: "true"

  policyTypes:
    - Egress

  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: nginx
      ports:
        - protocol: TCP
          port: 8080
