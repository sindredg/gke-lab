# Keeps one replica serving through an eviction, which a rollout is not.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: nginx
  namespace: demo
  labels:
    app.kubernetes.io/name: nginx
    app.kubernetes.io/part-of: k8-lab
spec:
  minAvailable: 1
  # Lets a drain evict a broken Pod the budget would otherwise hold.
  unhealthyPodEvictionPolicy: AlwaysAllow

  selector:
    matchLabels:
      app.kubernetes.io/name: nginx
