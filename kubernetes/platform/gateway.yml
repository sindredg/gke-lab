# The public entry point. GKE reconciles it into a global load balancer.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: external
  namespace: demo
  labels:
    app.kubernetes.io/part-of: k8-lab
  annotations:
    # Certificates come from Certificate Manager, so no key material here.
    networking.gke.io/certmap: k8-lab-gateway-cert-map
spec:
  gatewayClassName: gke-l7-global-external-managed

  # Names the reserved address; Terraform owns it, this only points at it.
  addresses:
    - type: NamedAddress
      value: k8-lab-gateway

  listeners:
    # Kept only to redirect. nginx-https-redirect attaches here.
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same

    - name: https
      protocol: HTTPS
      port: 443
      allowedRoutes:
        namespaces:
          from: Same
