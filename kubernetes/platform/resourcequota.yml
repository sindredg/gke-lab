apiVersion: v1
kind: ResourceQuota
metadata:
  name: demo-budget
  namespace: demo
  labels:
    app.kubernetes.io/part-of: k8-lab
spec:
  hard:
    # A deploy at sky's HPA maximum: 11 sky Pods, 4 nginx, 1 smoke test.
    requests.cpu: "5"
    requests.memory: 2Gi

    # Burst ceiling. Too low stalls a rollout rather than failing it.
    limits.cpu: "13"
    limits.memory: 4Gi

    pods: "16"
