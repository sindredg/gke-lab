# Gives the triage worker its own identity instead of the namespace
# default, and binds it to the Google identity that federates by
# Workload Identity rather than a mounted key.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: triage-worker
  namespace: agents
  labels:
    app.kubernetes.io/name: triage-worker
    app.kubernetes.io/part-of: k8-lab
  annotations:
    iam.gke.io/gcp-service-account: k8-lab-triage@example-security-lab.iam.gserviceaccount.com
# GKE's metadata server identifies the Pod by its ServiceAccount, so the
# application never reads a mounted token even though it uses Workload
# Identity.
automountServiceAccountToken: false
