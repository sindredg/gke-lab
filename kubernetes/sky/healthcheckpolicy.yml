# Points the load balancer's health check at the application's own /health endpoint, which is not routed publicly.
apiVersion: networking.gke.io/v1
kind: HealthCheckPolicy
metadata:
  name: golden-hour
  namespace: demo
  labels:
    app.kubernetes.io/part-of: k8-lab
spec:
  default:
    config:
      type: HTTP
      httpHealthCheck:
        port: 8080
        requestPath: /health
  targetRef:
    group: ""
    kind: Service
    name: golden-hour
