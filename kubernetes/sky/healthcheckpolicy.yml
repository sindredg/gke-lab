# Health-checks the app's own /health, which is not routed publicly.
apiVersion: networking.gke.io/v1
kind: HealthCheckPolicy
metadata:
  name: sky
  namespace: demo
  labels:
    app.kubernetes.io/part-of: k8-lab
spec:
  default:
    config:
      type: HTTP
      httpHealthCheck:
        port: 8080
        requestPath: /health
  targetRef:
    group: ""
    kind: Service
    name: sky
