# Publishes sky at /sky, plus /static and /api, which it asks for absolutely.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: sky
  namespace: demo
  labels:
    app.kubernetes.io/name: sky
    app.kubernetes.io/part-of: k8-lab
spec:
  parentRefs:
    - name: external
      sectionName: https

  hostnames:
    - sindrg.com

  rules:
    # The app is not prefix aware, so /sky is stripped before it arrives.
    - matches:
        - path:
            type: PathPrefix
            value: /sky
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: sky
          port: 80

    # Stripping the prefix also exposes /health and /version behind it.
    - matches:
        - path:
            type: PathPrefix
            value: /api
        - path:
            type: PathPrefix
            value: /static
      backendRefs:
        - name: sky
          port: 80
