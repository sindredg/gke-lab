# Runs and maintains two healthy sky replicas.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sky
  namespace: demo
  labels:
    app.kubernetes.io/name: sky
    app.kubernetes.io/part-of: k8-lab
spec:
  replicas: 2
  revisionHistoryLimit: 3

  selector:
    matchLabels:
      app.kubernetes.io/name: sky

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  template:
    metadata:
      labels:
        app.kubernetes.io/name: sky
        app.kubernetes.io/part-of: k8-lab
    spec:
      serviceAccountName: sky
      automountServiceAccountToken: false

      # Spreads the replicas across nodes when the pool has more than one, and schedules anyway when it does not. A required anti-affinity rule would instead leave the second replica Pending whenever the pool sits at its single-node floor. The value is in node upgrades, which replace nodes underneath a running workload.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: sky

      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: sky
          # Built from sindredg/aca-prod at a pinned commit and published to this project's registry, because the upstream pipeline publishes to Azure Container Registry, which this cluster cannot pull from. The application calls itself Golden Hour; here it is named for the path it serves.
          # Built by run 34004725462 from upstream 9393211. The pipeline replaces this with the digest it builds; this value is what an apply outside the pipeline deploys.
          image: europe-north1-docker.pkg.dev/example-security-lab/k8-lab/sky@sha256:7af41229bb716ba3586cbb4887c0f9f13575724cf586ae8fc35b0403956f7851
          imagePullPolicy: IfNotPresent

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

            # The application only reads its own code and writes nothing, so the image stays immutable at runtime.
            readOnlyRootFilesystem: true

          # A non-root process cannot bind a port below 1024.
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          # /health is the application's own endpoint. It is deliberately not published through the HTTPRoute.
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          # A Python interpreter needs more headroom than NGINX. Two replicas of this plus two of nginx stay inside the namespace budget.
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi

          volumeMounts:
            - name: tmp
              mountPath: /tmp

      # The only writable path, so a read-only root filesystem does not break the interpreter.
      volumes:
        - name: tmp
          emptyDir: {}
