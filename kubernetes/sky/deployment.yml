# Runs and maintains two healthy sky replicas.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sky
  namespace: demo
  labels:
    app.kubernetes.io/name: sky
    app.kubernetes.io/part-of: k8-lab
spec:
  replicas: 2
  revisionHistoryLimit: 3

  selector:
    matchLabels:
      app.kubernetes.io/name: sky

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  template:
    metadata:
      labels:
        app.kubernetes.io/name: sky
        app.kubernetes.io/part-of: k8-lab
    spec:
      serviceAccountName: sky
      automountServiceAccountToken: false

      # The preStop sleep counts against this, so 40 leaves 20s for in-flight requests once the sleep ends.
      terminationGracePeriodSeconds: 40

      # Spreads the replicas across nodes when the pool has more than one, and schedules anyway when it does not. A required anti-affinity rule would instead leave the second replica Pending whenever the pool sits at its single-node floor. The value is in node upgrades, which replace nodes underneath a running workload.
      topologySpreadConstraints:
        # Without this, the calculation counts Pods from the old ReplicaSet too, so every
        # replacement sees the old node as full and picks the other one. Both land together
        # and a rolling restart cannot undo it. Confining the count to one ReplicaSet is
        # what makes the spread hold across a rollout.
        - matchLabelKeys: ["pod-template-hash"]
          maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: sky

      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: sky
          # Built from sindredg/sky at a pinned commit and published to this project's registry, because the application repository publishes no image of its own. It was renamed from aca-prod, and now calls itself Sky, which matches the path it serves.
          # Built by run 34004725462 from upstream 9393211. The pipeline replaces this with the digest it builds; this value is what an apply outside the pipeline deploys.
          image: europe-north1-docker.pkg.dev/example-security-lab/k8-lab/sky@sha256:7af41229bb716ba3586cbb4887c0f9f13575724cf586ae8fc35b0403956f7851
          imagePullPolicy: IfNotPresent

          # Repeats the image's own command to add one flag. uvicorn logs every
          # request by default, and the only requests here are probes: two
          # readiness checks every five seconds, two liveness checks every ten,
          # and the load balancer's own health checks. With WORKLOADS logging
          # enabled that is billed ingest and a dashboard panel full of noise.
          # The nginx workload solves the same problem with access_log off.
          args:
            - uvicorn
            - app.src.main:app
            - --host
            - 0.0.0.0
            - --port
            - "8080"
            - --no-access-log

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

            # The application only reads its own code and writes nothing, so the image stays immutable at runtime.
            readOnlyRootFilesystem: true

          # A non-root process cannot bind a port below 1024.
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          # /health is the application's own endpoint. It is deliberately not published through the HTTPRoute.
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          # Keeps a stopping Pod serving until the load balancer has let it go. Without it, uvicorn stopped listening within a second and the endpoint was detached 12 to 13s later, and every request routed there in between failed. SIGTERM reaches the server only after the sleep.
          lifecycle:
            preStop:
              sleep:
                seconds: 20

          # A Python interpreter needs more headroom than NGINX. Two replicas of this plus two of nginx stay inside the namespace budget.
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi

          volumeMounts:
            - name: tmp
              mountPath: /tmp

      # The only writable path, so a read-only root filesystem does not break the interpreter.
      volumes:
        - name: tmp
          emptyDir: {}
