# Runs sky. hpa.yml owns the replica count, between two and eight.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sky
  namespace: demo
  labels:
    app.kubernetes.io/name: sky
    app.kubernetes.io/part-of: k8-lab
spec:
  # No replicas field: it would reset whatever the HPA has scaled to.
  revisionHistoryLimit: 3

  selector:
    matchLabels:
      app.kubernetes.io/name: sky

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  template:
    metadata:
      labels:
        app.kubernetes.io/name: sky
        app.kubernetes.io/part-of: k8-lab
    spec:
      serviceAccountName: sky
      automountServiceAccountToken: false

      # 60 covers the 35s preStop sleep and the requests still in flight.
      terminationGracePeriodSeconds: 60

      # Prefers one replica per node. Required would leave one Pending.
      topologySpreadConstraints:
        # Counts only this ReplicaSet, so the spread survives a rollout.
        - matchLabelKeys: ["pod-template-hash"]
          maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: sky

      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: sky
          # Built from a pinned sindredg/sky commit. The pipeline sets it.
          image: europe-north1-docker.pkg.dev/example-security-lab/k8-lab/sky@sha256:7af41229bb716ba3586cbb4887c0f9f13575724cf586ae8fc35b0403956f7851
          imagePullPolicy: IfNotPresent

          # Repeats the image's command to add flags. Probes would flood logs.
          args:
            - uvicorn
            - app.src.main:app
            - --host
            - 0.0.0.0
            - --port
            - "8080"
            - --no-access-log
            # The load balancer reuses a connection for 600s; 5s got 503s.
            - --timeout-keep-alive
            - "620"

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

            # The app writes nothing, so the root filesystem stays read-only.
            readOnlyRootFilesystem: true

          # A non-root process cannot bind a port below 1024.
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          # The app's own endpoint, deliberately not routed publicly.
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3

          # Catches a hung process, not a busy one. 2s and 3 was too tight.
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6

          # Keeps a stopping Pod serving until the load balancer lets go.
          lifecycle:
            preStop:
              sleep:
                seconds: 35

          # Sized from the load runs: 70% of a 350m request is about 12 rps.
          resources:
            requests:
              cpu: 350m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 256Mi

          volumeMounts:
            - name: tmp
              mountPath: /tmp

      # The only writable path, so a read-only root does not break it.
      volumes:
        - name: tmp
          emptyDir: {}
