# Keeps one replica serving through an eviction, which a rollout is not.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: sky
  namespace: demo
  labels:
    app.kubernetes.io/name: sky
    app.kubernetes.io/part-of: k8-lab
spec:
  minAvailable: 1

  selector:
    matchLabels:
      app.kubernetes.io/name: sky
