# Allows traffic and health checks from Google Cloud's fixed load balancer IP ranges.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sky-allow-gateway
  namespace: demo
  labels:
    app.kubernetes.io/name: sky
    app.kubernetes.io/part-of: k8-lab
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: sky

  policyTypes:
    - Ingress

  ingress:
    # Uses ipBlock to target external Google IPs instead of internal Pods.
    - from:
        - ipBlock:
            cidr: 130.211.0.0/22
        - ipBlock:
            cidr: 35.191.0.0/16
      ports:
        - protocol: TCP
          port: 8080
---
# Allows labelled clients in the namespace to reach the sky Pods, which is what the pipeline's smoke test is.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sky-allow-http
  namespace: demo
  labels:
    app.kubernetes.io/name: sky
    app.kubernetes.io/part-of: k8-lab
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: sky

  policyTypes:
    - Ingress

  ingress:
    - from:
        - podSelector:
            matchLabels:
              sky-client: "true"
      ports:
        - protocol: TCP
          port: 8080
---
# Allows those same clients to open the connection, which their own default deny egress blocks.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sky-client-allow-egress
  namespace: demo
  labels:
    app.kubernetes.io/part-of: k8-lab
spec:
  podSelector:
    matchLabels:
      sky-client: "true"

  policyTypes:
    - Egress

  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: sky
      ports:
        - protocol: TCP
          port: 8080
