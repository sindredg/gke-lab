# Scales sky on CPU. Applied by an operator, not by the pipeline.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: sky
  namespace: demo
  labels:
    app.kubernetes.io/name: sky
    app.kubernetes.io/part-of: k8-lab
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: sky

  # Two holds the budget at rest; eight needs a third node and fits the quota.
  minReplicas: 2
  maxReplicas: 8

  # Utilization is measured against the 350m request, so 70% is 245m a Pod.
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70

  # The Kubernetes defaults, written down so the timing is a reviewed choice.
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
    scaleDown:
      stabilizationWindowSeconds: 300
