# Curls a Service from inside the cluster, so the check crosses the same
# NetworkPolicy and Pod Security boundaries a real client would.
name: Smoke test
description: Requests a Service's health endpoint from a throwaway Pod in the cluster.

inputs:
  namespace:
    description: Namespace holding the Service and the client NetworkPolicy.
    required: true
  service:
    description: Service to request, reached by its in-cluster DNS name.
    required: true
  path:
    description: Path on the Service that answers the check, with a leading slash.
    required: true
  client-label:
    description: >-
      Label the ingress NetworkPolicy admits, as key=value. Named rather than
      derived, because it is a policy contract and not a naming convention.
    required: true
  image:
    description: Image providing curl.
    required: false
    default: curlimages/curl:8.11.1

runs:
  using: composite
  steps:
    # The label satisfies the NetworkPolicy, the securityContext the standard.
    - name: Request ${{ inputs.path }} from ${{ inputs.service }}
      shell: bash
      env:
        NAMESPACE: ${{ inputs.namespace }}
        SERVICE: ${{ inputs.service }}
        PATH_: ${{ inputs.path }}
        CLIENT_LABEL: ${{ inputs.client-label }}
        IMAGE: ${{ inputs.image }}
        POD: smoke-${{ inputs.service }}-${{ github.run_id }}
      run: |
        kubectl run "$POD" -n "$NAMESPACE" \
          --image="$IMAGE" \
          --labels="$CLIENT_LABEL" \
          --restart=Never \
          --overrides="$(cat <<JSON
        {
          "spec": {
            "containers": [{
              "name": "smoke",
              "image": "${IMAGE}",
              "command": ["curl","-sSf","--max-time","5","http://${SERVICE}${PATH_}"],
              "securityContext": {
                "allowPrivilegeEscalation": false,
                "runAsNonRoot": true,
                "runAsUser": 100,
                "capabilities": { "drop": ["ALL"] },
                "seccompProfile": { "type": "RuntimeDefault" }
              }
            }]
          }
        }
        JSON
        )"

        if ! kubectl wait --for=jsonpath='{.status.phase}'=Succeeded \
               "pod/$POD" -n "$NAMESPACE" --timeout=90s; then
          echo "--- smoke pod did not succeed ---"
          kubectl describe "pod/$POD" -n "$NAMESPACE"
          kubectl logs "$POD" -n "$NAMESPACE" || true
          kubectl delete "pod/$POD" -n "$NAMESPACE" --ignore-not-found
          exit 1
        fi

        kubectl logs "$POD" -n "$NAMESPACE"
        kubectl delete "pod/$POD" -n "$NAMESPACE" --ignore-not-found
