# Proposes action bumps, because a pinned SHA is otherwise a frozen one.
version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Oslo
    open-pull-requests-limit: 3
    commit-message:
      prefix: ci

  # The frontend base is pinned by digest, so without this a patched base never arrives.
  - package-ecosystem: docker
    directory: /app
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Oslo
    open-pull-requests-limit: 1
    commit-message:
      prefix: fix
